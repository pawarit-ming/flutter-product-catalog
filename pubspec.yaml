name: product_catalog
description: "A Flutter product catalog powered by DummyJSON, with Riverpod state management, Dio networking, and a locally saved cart and wishlist."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  dio: ^5.11.1
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true

  # Anuphan covers Thai and Latin; one variable file holds every weight.
  # Licence: assets/fonts/anuphan-OFL.txt.
  fonts:
    - family: Anuphan
      fonts:
        - asset: assets/fonts/Anuphan-Variable.ttf
